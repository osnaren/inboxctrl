version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inboxctrl_db
    restart: always
    environment:
      POSTGRES_USER: inboxctrl_user
      POSTGRES_PASSWORD: inboxctrl_password
      POSTGRES_DB: inboxctrl
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
