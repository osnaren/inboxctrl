services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        DB_PROFILE: sqlite
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:./dev.db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-demo-secret}
      INBOXCTRL_SECRET: ${INBOXCTRL_SECRET:-demo-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INBOXCTRL_DEMO_MODE: 'true'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      INBOXCTRL_PLUGINS: ${INBOXCTRL_PLUGINS:-}
    command:
      - sh
      - -c
      - >
        pnpm exec prisma db push --schema packages/db/prisma/schema.prisma &&
        pnpm demo:reset &&
        pnpm seed:demo &&
        pnpm --filter @inboxctrl/web exec next start --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - '${INBOXCTRL_DEMO_PORT:-3000}:3000'
